# 复制为 config.toml 后修改；config.toml 不进 git（密钥在此）。

[server]
host = "127.0.0.1"
port = 8600

[training]
# 训练/导出子进程使用的 python 解释器（torch/ultralytics 所在环境；平台自身 venv 无 torch）。
# X-AnyLabeling 已是本仓库 vendor/X-AnyLabeling 子模块（ADR 0008），venv 在子模块内，
# 路径随克隆位置调整：git submodule update --init 后在其内建 .venv 并安装依赖。
python = "/home/wuguang/Desktop/workspace/VisionTrainer/vendor/X-AnyLabeling/.venv/bin/python"
# 子进程入口（真实链路；tests/stub_*.py 仅测试用，不要写进正式配置）
trainer_entry = "~/Desktop/workspace/VisionTrainer/src/visiontrainer/training/trainer_entry.py"
export_entry = "~/Desktop/workspace/VisionTrainer/src/visiontrainer/training/export_entry.py"
# 数据集根目录（05 号票：默认跟 Ultralytics datasets_dir 设置）
datasets_dir = "~/datasets"
# 训练产物根目录（runs_dir 必须绝对路径，01 号票）
runs_dir = "~/datasets/runs"
# 队首启动前检测 GPU 是否被外部进程占用（桌面端加载模型也会触发；关掉则盲启）
check_occupancy = true

[llm]
# OpenAI 兼容端点（06 号票）。云端槽默认智谱 coding plan；base_url 以智谱官方文档为准。
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
api_key = "" # 只存本地，不进 git
model = "glm-5.3-flash"
# 本地备用槽示例：base_url = "http://localhost:11434/v1"（Ollama）

# 回注部署（09 号票）：标注端模型库位置（训练 venv 需含 onnxruntime 才能做导出验证）
model_lib_dir = "~/Documents/x-anylabeling-models"
