name: CI

on:
  push:
    branches:
      - rewrite
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # fastmcp 是 MCP 的软依赖（未装则 /mcp 不挂载），未进 pyproject——
      # CI 按全绿运行形态补装（生产机 venv 同为此形态）；test_m10_mcp 四项依赖它。
      - run: uv pip install fastmcp
      # CI 环境从模板落地 config.toml（不入库）：conftest 会话守卫与
      # test_isolation 的真值断言都以仓库根 config.toml 存在为前提。
      - run: cp config.example.toml config.toml
      # example 数据根 ~/datasets（runs 同根）在 runner 上不存在；任一测试经
      # get_datasets_root() 的 mkdir(parents=True) 创建它后，会话守卫的生产
      # 账本对账把「目录从无到有（文件数 0→0、空目录指纹）」判为生产数据
      # 变动 → 强设 TESTS_FAILED（summary 仍 0 failed、退出码 1，极易误诊）。
      # 预创建对齐快照基线；生产机数据根本就存在，不受影响。
      - run: mkdir -p ~/datasets/runs
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 守卫须在 checkout 之后的 step 求值：hashFiles 基于 GITHUB_WORKSPACE，
      # job 级 if 在 job 发往 runner 前求值、此时 workspace 为空恒返回空串——
      # 写在 job 级会让本 job 永久跳过。frontend/ 目录建立后自动生效。
      - id: has_frontend
        run: echo "present=${{ hashFiles('frontend/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_frontend.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.has_frontend.outputs.present == 'true'
        working-directory: frontend
      - run: npx vitest run
        if: steps.has_frontend.outputs.present == 'true'
        working-directory: frontend
      - run: npm run build
        if: steps.has_frontend.outputs.present == 'true'
        working-directory: frontend
